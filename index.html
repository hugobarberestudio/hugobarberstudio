<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbería - Agenda tu Hora</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: linear-gradient(rgba(10, 10, 10, 0.88), rgba(10, 10, 10, 0.88)), url('fondo.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #e0e0e0;
            margin: 0;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 650px;
            background-color: rgba(20, 20, 20, 0.96);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.85);
            border: 1px solid #d4af37;
            text-align: center;
            box-sizing: border-box;
        }

        /* LOGO CON BORDES DIFUMINADOS */
        .logo-img {
            width: 100%;
            max-width: 280px;
            height: auto;
            margin: 15px auto 15px auto;
            display: block;
            border-radius: 12px;
            box-shadow: 0 0 20px 15px rgba(20, 20, 20, 0.96); 
            border: none;
        }

        .subtitle {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 25px;
            display: block;
            color: #d4af37;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.6);
            letter-spacing: 0.5px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
            transition: transform 0.2s;
        }

        .btn-instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: white;
        }

        .btn-whatsapp {
            background-color: #25D366;
            color: white;
        }

        .social-btn i {
            font-size: 1.2rem;
        }

        .social-btn:hover {
            transform: scale(1.05);
        }

        /* ALERTA LLAMATIVA PARA EL ABONO */
        .alerta-abono {
            background-color: rgba(212, 175, 55, 0.1);
            border-left: 4px solid #d4af37;
            padding: 15px;
            border-radius: 6px;
            text-align: left;
            margin-bottom: 20px;
        }

        .alerta-abono p {
            margin: 0;
            font-size: 0.95rem;
            color: #e0e0e0;
            line-height: 1.4;
        }

        .alerta-abono strong {
            color: #d4af37;
        }

        .services {
            text-align: left;
            margin-bottom: 30px;
            background: #1a1a1a;
            padding: 15px;
            border-radius: 10px;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #2a2a2a;
            scroll-behavior: smooth;
        }

        .services::-webkit-scrollbar {
            width: 4px;
        }
        .services::-webkit-scrollbar-track {
            background: #111;
            border-radius: 10px;
        }
        .services::-webkit-scrollbar-thumb {
            background: #d4af37;
            border-radius: 10px;
        }

        .service-item {
            font-family: 'Bebas Neue', sans-serif;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 15px;
            border-bottom: 1px dashed rgba(212, 175, 55, 0.2);
            font-size: 1.35rem;
            color: #e0e0e0;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 8px;
            margin-bottom: 2px;
        }

        .service-item:hover {
            background-color: rgba(212, 175, 55, 0.05);
        }

        .service-item.selected {
            background-color: #111 !important;
            border: 1.5px solid #d4af37; 
            color: #d4af37;
            transform: scale(1.03) translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.2);
        }

        .price {
            color: #d4af37 !important;
            font-weight: bold;
            font-size: 1.3rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            letter-spacing: 0.5px;
        }

        .section-title {
            font-size: 1.2rem;
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 25px 0 15px 0;
            text-align: left;
            font-weight: bold;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 35px;
        }

        .gallery-item {
            overflow: hidden;
            border-radius: 10px;
            aspect-ratio: 1 / 1; 
            border: 1px solid #333;
            background-color: #252525;
            animation: fadeInFotos 1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            opacity: 0;
        }

        .gallery-grid .gallery-item:nth-child(1) { animation-delay: 0.1s; }
        .gallery-grid .gallery-item:nth-child(2) { animation-delay: 0.2s; }
        .gallery-grid .gallery-item:nth-child(3) { animation-delay: 0.3s; }
        .gallery-grid .gallery-item:nth-child(4) { animation-delay: 0.4s; }
        .gallery-grid .gallery-item:nth-child(5) { animation-delay: 0.5s; }

        .gallery-item:last-child:nth-child(odd) {
            grid-column: 1 / -1; 
            margin: 0 auto;
            width: 50%; 
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.08);
        }

        /* DISEÑO DE RESEÑAS / TESTIMONIOS */
        .reviews-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .review-card {
            background-color: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            padding: 15px;
            text-align: left;
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .review-user {
            font-weight: bold;
            color: #fff;
            font-size: 0.95rem;
        }

        .review-stars {
            color: #d4af37;
            font-size: 0.85rem;
        }

        .review-text {
            font-size: 0.9rem;
            color: #b3b3b3;
            margin: 0;
            line-height: 1.4;
            font-style: italic;
        }

        .horarios-card {
            background-color: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            padding: 20px;
            text-align: left;
            margin-bottom: 30px;
        }

        .horario-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px dashed rgba(255,255,255,0.05);
            font-size: 1rem;
        }
        .horario-row:last-child { border-bottom: none; }
        .horario-row i { color: #d4af37; margin-right: 8px; }

        /* PREGUNTAS FRECUENTES (FAQ) ACCORDION */
        .faq-container {
            text-align: left;
            margin-bottom: 35px;
        }

        .faq-item {
            background-color: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            margin-bottom: 10px;
            overflow: hidden;
        }

        .faq-question {
            padding: 15px;
            font-weight: bold;
            font-size: 0.95rem;
            color: #fff;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .faq-question:hover {
            background-color: rgba(212, 175, 55, 0.05);
        }

        .faq-answer {
            padding: 0 15px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out, padding 0.3s ease-out;
            color: #aaa;
            font-size: 0.9rem;
            line-height: 1.5;
            background-color: #151515;
        }

        .faq-item.active .faq-answer {
            padding: 15px;
            max-height: 200px;
            border-top: 1px solid #252525;
        }

        .faq-question i {
            transition: transform 0.3s;
            color: #d4af37;
        }

        .faq-item.active .faq-question i {
            transform: rotate(180deg);
        }

        /* RECUADROS FLEXIBLES DE PAGO */
        .info-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        @media (min-width: 480px) {
            .info-grid { flex-direction: row; }
            .info-pago-card, .info-banco-card { flex: 1; margin-bottom: 0 !important; }
        }

        .info-pago-card, .info-banco-card {
            background-color: #1a1a1a;
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 10px;
            padding: 20px;
            text-align: left;
            box-sizing: border-box;
        }

        .info-banco-card { border: 1px solid rgba(37, 211, 102, 0.4); }

        .pago-item { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 15px; }
        .pago-item:last-child { margin-bottom: 0; }
        .pago-item i { color: #d4af37; font-size: 1.2rem; margin-top: 3px; width: 20px; text-align: center; }
        .info-banco-card .pago-item i { color: #25D366; }
        .pago-text h4 { margin: 0 0 4px 0; font-size: 1.05rem; color: #fff

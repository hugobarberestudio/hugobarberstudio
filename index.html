<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbería - Agenda tu Hora</title>
    
    <link href="https://googleapis.com" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: linear-gradient(rgba(10, 10, 10, 0.88), rgba(10, 10, 10, 0.88)), url('fondo.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #e0e0e0;
            margin: 0;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 650px;
            background-color: rgba(20, 20, 20, 0.96);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.85);
            border: 1px solid #d4af37;
            text-align: center;
            box-sizing: border-box;
        }

        .logo-img {
            width: 100%;
            max-width: 280px;
            height: auto;
            margin: 15px auto 15px auto;
            display: block;
            border-radius: 12px;
            box-shadow: 0 0 20px 15px rgba(20, 20, 20, 0.96); 
            border: none;
        }

        .subtitle {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 25px;
            display: block;
            color: #d4af37;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.6);
            letter-spacing: 0.5px;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
            transition: transform 0.2s;
        }

        .btn-instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            color: white;
        }

        .btn-whatsapp {
            background-color: #25D366;
            color: white;
        }

        .social-btn:hover {
            transform: scale(1.05);
        }

        .alerta-abono {
            background-color: rgba(212, 175, 55, 0.1);
            border-left: 4px solid #d4af37;
            padding: 15px;
            border-radius: 6px;
            text-align: left;
            margin-bottom: 20px;
        }

        .alerta-abono p {
            margin: 0;
            font-size: 0.95rem;
            color: #e0e0e0;
            line-height: 1.4;
        }

        .alerta-abono strong {
            color: #d4af37;
        }

        .services {
            text-align: left;
            margin-bottom: 30px;
            background: #1a1a1a;
            padding: 15px;
            border-radius: 10px;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #2a2a2a;
            scroll-behavior: smooth;
        }

        .services::-webkit-scrollbar {
            width: 4px;
        }
        .services::-webkit-scrollbar-track {
            background: #111;
            border-radius: 10px;
        }
        .services::-webkit-scrollbar-thumb {
            background: #d4af37;
            border-radius: 10px;
        }

        .service-item {
            font-family: 'Bebas Neue', sans-serif;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 15px;
            border-bottom: 1px dashed rgba(212, 175, 55, 0.2);
            font-size: 1.35rem;
            color: #e0e0e0;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 8px;
            margin-bottom: 2px;
        }

        .service-item:hover {
            background-color: rgba(212, 175, 55, 0.05);
        }

        .service-item.selected {
            background-color: #111 !important;
            border: 1.5px solid #d4af37; 
            color: #d4af37;
            transform: scale(1.02);
        }

        .price {
            color: #d4af37 !important;
            font-weight: bold;
            font-size: 1.3rem;
        }

        .section-title {
            font-size: 1.2rem;
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 25px 0 15px 0;
            text-align: left;
            font-weight: bold;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 35px;
        }

        .gallery-item {
            overflow: hidden;
            border-radius: 10px;
            aspect-ratio: 1 / 1; 
            border: 1px solid #333;
            background-color: #252525;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .gallery-item:last-child:nth-child(odd) {
            grid-column: 1 / -1; 
            margin: 0 auto;
            width: 50%; 
        }

        .reviews-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .review-card {
            background-color: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            padding: 15px;
            text-align: left;
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .review-user { font-weight: bold; color: #fff; font-size: 0.95rem; }
        .review-stars { color: #d4af37; font-size: 0.85rem; }
        .review-text { font-size: 0.9rem; color: #b3b3b3; margin: 0; font-style: italic; }

        .horarios-card {
            background-color: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            padding: 20px;
            text-align: left;
            margin-bottom: 30px;
        }

        .horario-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px dashed rgba(255,255,255,0.05);
        }
        .horario-row:last-child { border-bottom: none; }
        .horario-row i { color: #d4af37; margin-right: 8px; }

        .faq-container { text-align: left; margin-bottom: 35px; }
        .faq-item { background-color: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
        .faq-question { padding: 15px; font-weight: bold; font-size: 0.95rem; color: #fff; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .faq-answer { padding: 0 15px; max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; color: #aaa; font-size: 0.9rem; background-color: #151515; }
        .faq-item.active .faq-answer { padding: 15px; max-height: 200px; border-top: 1px solid #252525; }
        .faq-question i { color: #d4af37; transition: transform 0.3s; }
        .faq-item.active .faq-question i { transform: rotate(180deg); }

        .info-grid { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; }
        
        @media (min-width: 480px) { 
            .info-grid { display: flex; flex-direction: row; gap: 15px; } 
        }
    </style>
</head>
<body>

    <!-- Botón Flotante para la Música de Fondo -->
    <button id="musicBtn" style="position: fixed; bottom: 20px; right: 20px; background: rgba(20,20,20,0.95); border: 1px solid #d4af37; color: #d4af37; border-radius: 50%; width: 50px; height: 50px; font-size: 1.2rem; cursor: pointer; z-index: 9999; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; transition: transform 0.2s;">
        <i id="musicIcon" class="fas fa-music"></i>
    </button>

    <!-- Elemento de Audio Oculto (Música Instrumental de Fondo) -->
    <audio id="bgMusic" loop>
        <source src="https://soundhelix.com" type="audio/mpeg">
        Tu navegador no soporta el elemento de audio.
    </audio>

    <div class="container">
        <!-- Logo de la Barbería -->
        <img src="logo.jpg" alt="Logo Barbería" class="logo-img">
        <span class="subtitle">Estilo y Tradición</span>

        <!-- Redes Sociales -->
        <div class="social-links">
            <a href="https://instagram.com" target="_blank" class="social-btn btn-instagram">
                <i class="fab fa-instagram"></i> Instagram
            </a>
            <a href="https://wa.me" target="_blank" class="social-btn btn-whatsapp">
                <i class="fab fa-whatsapp"></i> WhatsApp
            </a>
        </div>

        <!-- Alerta de Reserva -->
        <div class="alerta-abono">
